name: docs
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make venv
      - name: mirrored pages match kit.ref
        run: make check
      - name: strict build
        run: make build
